services:
  - type: worker
    name: pikabora-whatsapp-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PIKABORA_BACKEND_URL
        sync: false
      - key: PIKABORA_REVIEWER_JID
        sync: false
      - key: NODE_VERSION
        value: "20.11.0"
